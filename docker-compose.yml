services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: mfc_planner
      POSTGRES_USER: mfc
      POSTGRES_PASSWORD: change_me
    volumes:
      - mfc_pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql://mfc:change_me@db:5432/mfc_planner
      CORS_ORIGINS: http://localhost:8080,http://127.0.0.1:8080
    depends_on:
      - db
    ports:
      - "8000:8000"

volumes:
  mfc_pgdata:
